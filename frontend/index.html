<!DOCTYPE html>
<html ng-app="planAssistant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plan Assistant</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular-route.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/chat.js"></script>
</head>
<body>
  <div ng-controller="NavCtrl as nav">
    <header class="topbar" ng-if="nav.auth.isLoggedIn()">
      <a class="brand" href="#!/chat"><span class="logo-sm">PA</span> Plan Assistant</a>
      <nav></nav>
      <div class="user">
        <span>{{nav.auth.user()}}</span>
        <button class="btn-ghost" ng-click="nav.logout()">Log out</button>
      </div>
    </header>
  </div>
  <main ng-view></main>
</body>
</html>
